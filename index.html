const cardHTML = <div class="game-card" data-id="${game.id}" data-title="${game.title.toLowerCase()} ${game.tags}" data-category="${game.category}"> <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${game.id}', event)">${isFav ? '❤️' : '★'}</button> <div class="game-thumb">${game.icon}${hasTrendingBadge}</div> <div class="game-info"> <span class="tag">${game.category.split(' ')[0].toUpperCase()}</span> <h3>${game.title}</h3> <p>${game.desc}</p> <button class="btn" onclick="openGame('${game.url}', '${game.title}')">Play Now</button> </div> </div>;
gameGrid.insertAdjacentHTML('beforeend', cardHTML);
});
filterGames();
}
// --- Favorites Core Handling ---
window.toggleFavorite = function(id, event) {
event.stopPropagation();
if (favorites.includes(id)) {
favorites = favorites.filter(favId => favId !== id);
} else {
favorites.push(id);
}
localStorage.setItem('gamesgalore_favs', JSON.stringify(favorites));
initializeCatalog();
};
// --- Search and Filtration Loops ---
function filterGames() {
const searchTerm = searchInput.value.toLowerCase();
const cards = document.querySelectorAll('.game-card');
let visibleCount = 0;
cards.forEach(card => {
const id = card.getAttribute('data-id');
const titleText = card.getAttribute('data-title');
const categories = card.getAttribute('data-category').split(' ');
const matchesSearch = titleText.includes(searchTerm);
let matchesCategory = false;
if (activeCategory === 'all') matchesCategory = true;
else if (activeCategory === 'fav') matchesCategory = favorites.includes(id);
else matchesCategory = categories.includes(activeCategory);
if (matchesSearch && matchesCategory) {
card.style.display = 'flex';
visibleCount++;
} else {
card.style.display = 'none';
}
});
gameCounter.textContent = Showing ${visibleCount} games;
}
searchInput.addEventListener('input', filterGames);
filterBtns.forEach(btn => {
btn.addEventListener('click', () => {
filterBtns.forEach(b => b.classList.remove('active'));
btn.classList.add('active');
activeCategory = btn.getAttribute('data-category');
filterGames();
});
});
// --- Player Modal Control Canvas ---
window.openGame = function(url, title) {
modalGameTitle.textContent = "Live Stream: " + title;
gameIframe.src = url;
gameModal.style.display = 'flex';
};
window.closeModal = function() {
gameModal.style.display = 'none';
gameIframe.src = '';
};
gameModal.addEventListener('click', (e) => {
if (e.target === gameModal) closeModal();
});
// Run setup loop
initializeCatalog();
